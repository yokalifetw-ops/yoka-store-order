<script>
const LIFF_ID_TAICHUNG = '2009269118-FhJVRpRo';
const LIFF_ID_MULTISTORE = '2009269118-w3n2Pk8L';

function getRawParamsBeforeLiffInit(){

  const qs =
    new URLSearchParams(
      window.location.search
    );

  let params =
    new URLSearchParams(
      qs.toString()
    );

  const state =
    qs.get('liff.state') || '';

  if(state){

    try{

      const decoded =
        decodeURIComponent(
          state
        );

      const queryPart =
        decoded.includes('?')
          ? decoded.substring(
              decoded.indexOf('?') + 1
            )
          : decoded.replace(
              /^\/+/, ''
            );

      const stateParams =
        new URLSearchParams(
          queryPart
        );

      stateParams.forEach(
        (value, key) => {
          if(!params.get(key)){
            params.set(
              key,
              value
            );
          }
        }
      );

    }catch(err){

      console.warn(
        'LIFF 預解析失敗',
        err
      );
    }
  }

  return params;
}


function resolveLiffIdBeforeInit(){

  const params =
    getRawParamsBeforeLiffInit();

  const store =
    String(
      params.get('store') || ''
    )
      .trim()
      .toUpperCase();

  // 台北、新竹與未來共用多門市系統使用新 LIFF。
  // 台中舊系統若沒有 store 或 store=TC，維持原 LIFF，避免影響現行系統。
  if(
    store &&
    store !== 'TC'
  ){
    return LIFF_ID_MULTISTORE;
  }

  return LIFF_ID_TAICHUNG;
}

let ORDER_NO = '';
let TOKEN = '';
let API_URL = '';
let PRODUCT = '';
let TOTAL = '';
let STORE_CODE = '';

let LINE_USER_ID = '';
let LINE_DISPLAY_NAME = '';
let LINE_ACCESS_TOKEN = '';
let LINE_ID_TOKEN = '';
let IS_FRIEND = false;
let LIFF_OK = false;

let IS_PICKUP = false;
let INVOICE_TYPE = '';
let PAYMENT_METHOD = '';
let PAYMENT_URL = '';


function parseMoney(v){

  if(
    typeof v === 'number'
  ){

    return Number.isFinite(v)
      ? v
      : NaN;
  }


  const cleaned =
    String(
      v ?? ''
    )
      .replace(
        /NT\$/gi,
        ''
      )
      .replace(
        /\$/g,
        ''
      )
      .replace(
        /,/g,
        ''
      )
      .replace(
        /\s+/g,
        ''
      )
      .trim();


  if(!cleaned){
    return NaN;
  }


  const n =
    Number(
      cleaned
    );


  return Number.isFinite(n)
    ? n
    : NaN;
}


function money(v){

  const n =
    parseMoney(
      v
    );


  if(
    !Number.isFinite(n)
  ){

    return '金額讀取失敗';
  }


  return '$' +
    n.toLocaleString(
      'zh-TW'
    );
}


function setStatus(text, type=''){
  const el = document.getElementById('lineStatus');
  el.textContent = text;
  el.style.color =
    type === 'ok'
      ? '#19873b'
      : type === 'warn'
        ? '#9a6700'
        : type === 'error'
          ? '#a40000'
          : '#777';
}


function showError(msg){
  const el = document.getElementById('error');
  el.textContent = msg;
  el.style.display = 'block';
}


function readOrderParamsAfterLiffInit(){

  // LINE 官方規格：
  // LIFF URL 上的附加參數在 primary redirect 時會先放在 liff.state，
  // liff.init() resolve 後才會還原到 location.search。
  const qs =
    new URLSearchParams(
      window.location.search
    );

  ORDER_NO =
    qs.get('order') || '';

  TOKEN =
    qs.get('token') || '';

  API_URL =
    qs.get('api') || '';

  PRODUCT =
    qs.get('product') || '';

  TOTAL =
    qs.get('total') || '';

  STORE_CODE =
    String(
      qs.get('store') || 'TC'
    )
      .trim()
      .toUpperCase() ||
    'TC';


  // 防呆：若某些環境仍殘留 liff.state，僅讀取、不修改它。
  if (
    (!ORDER_NO || !TOKEN || !API_URL) &&
    qs.get('liff.state')
  ) {

    try {

      const state =
        decodeURIComponent(
          qs.get('liff.state')
        );

      const queryPart =
        state.includes('?')
          ? state.substring(
              state.indexOf('?') + 1
            )
          : state.replace(
              /^\/+/,
              ''
            );

      const sp =
        new URLSearchParams(
          queryPart
        );

      ORDER_NO =
        ORDER_NO ||
        sp.get('order') ||
        '';

      TOKEN =
        TOKEN ||
        sp.get('token') ||
        '';

      API_URL =
        API_URL ||
        sp.get('api') ||
        '';

      PRODUCT =
        PRODUCT ||
        sp.get('product') ||
        '';

      TOTAL =
        TOTAL ||
        sp.get('total') ||
        '';

      STORE_CODE =
        STORE_CODE ||
        String(
          sp.get('store') || ''
        )
          .trim()
          .toUpperCase();

    } catch (err) {

      console.warn(
        'liff.state 解析失敗',
        err
      );
    }
  }

  // 台中舊 QR 本來沒有 store=TC。
  // 因此沒有 store 參數時一律視為台中，確保 LINE Pay 走與台北／新竹相同付款交接。
  STORE_CODE =
    String(
      STORE_CODE || 'TC'
    )
      .trim()
      .toUpperCase() ||
    'TC';

}


function getPaymentMethodHint(method){
  const value=String(method||'').trim();
  const map={
    '現金':'付款方式：現金｜請於現場完成付款。',
    '信用卡':'付款方式：信用卡／行動支付｜資料送出後請繼續完成線上付款。',
    '匯款':'付款方式：銀行匯款｜訂單成立後 LINE 將發送匯款帳號與後五碼回報按鈕。',
    'LINE Pay':'付款方式：LINE Pay｜填完收件資料後，下一步會直接進入 LINE Pay 付款。',
    '貨到付款':'付款方式：貨到付款｜商品配送／到貨時再支付款項。'
  };
  return map[value]||(value?'付款方式：'+value:'');
}
function renderPaymentMethodHint(){
  const box=document.getElementById('paymentMethodBox'); if(!box) return; const text=getPaymentMethodHint(PAYMENT_METHOD); box.textContent=text; box.style.display=text?'block':'none';
}

async function loadOrderMeta(){

  try{

    const url =
      new URL(
        API_URL
      );

    url.searchParams.set(
      'action',
      'getCustomerOrder'
    );

    url.searchParams.set(
      'orderNo',
      ORDER_NO
    );

    url.searchParams.set(
      'token',
      TOKEN
    );


    const response =
      await fetch(
        url.toString(),
        {
          method:
            'GET',
          redirect:
            'follow'
        }
      );


    if(
      !response.ok
    ){
      return;
    }


    const res =
      await response.json();


    if(
      !res ||
      !res.success
    ){
      return;
    }


    // V15A2：訂單金額與商品資訊一律以後端訂單資料為準，
    // 不再以 QR query string 的 total / product 當最終值。
    if(
      res.total !== undefined &&
      res.total !== null
    ){

      const parsedTotal =
        parseMoney(
          res.total
        );


      if(
        Number.isFinite(
          parsedTotal
        )
      ){

        TOTAL =
          String(
            parsedTotal
          );
      }
    }

    PRODUCT =
      String(
        res.productName || PRODUCT || ''
      );

    document
      .getElementById(
        'product'
      )
      .textContent =
        PRODUCT ||
        '門市訂購商品';

    const backendMoney =
      money(
        TOTAL
      );


    document
      .getElementById(
        'total'
      )
      .textContent =
        backendMoney === '金額讀取失敗'
          ? '訂單金額：讀取失敗'
          : (
              '訂單金額：' +
              backendMoney
            );


    IS_PICKUP =
      Boolean(
        res.isPickup
      );


    INVOICE_TYPE =
      String(
        res.invoiceType || ''
      ).trim();

    PAYMENT_METHOD =
      String(
        res.paymentMethod || ''
      ).trim();


    renderPaymentMethodHint();


    const address =
      document.getElementById(
        'address'
      );

    const note =
      document.getElementById(
        'note'
      );

    const email =
      document.getElementById(
        'email'
      );

    const emailReq =
      document.getElementById(
        'emailReq'
      );

    const emailSection =
      document.getElementById(
        'emailSection'
      );

    const addressHint =
      document.getElementById(
        'addressHint'
      );


    if(
      IS_PICKUP
    ){

      address.value =
        '自取';

      address.readOnly =
        true;

      address.required =
        false;


      note.value =
        '自取';

      note.readOnly =
        true;


      if(
        addressHint
      ){

        addressHint.textContent =
          '配送地址已自動帶入「自取」，無需填寫。';
      }

    }


    const hasInvoice =
      Boolean(
        INVOICE_TYPE
      );


    const emailRequired =
      INVOICE_TYPE ===
      '公司（三聯）';


    // 不需要發票：Email 整段隱藏。
    // 個人（二聯）：顯示但非必填。
    // 公司（三聯）：顯示且必填。
    if(
      emailSection
    ){

      emailSection.style.display =
        hasInvoice
          ? 'block'
          : 'none';
    }


    email.required =
      emailRequired;


    if(
      !hasInvoice
    ){

      email.value =
        '';
    }


    if(
      emailReq
    ){

      emailReq.style.display =
        emailRequired
          ? 'inline'
          : 'none';
    }


    if(
      hasInvoice &&
      res.email
    ){

      email.value =
        res.email;
    }


    updateSubmit();

  }catch(err){

    console.warn(
      '訂單附加資料載入失敗',
      err
    );
  }
}


function renderOrder(){

  if(
    !ORDER_NO ||
    !TOKEN ||
    !API_URL
  ){

    document
      .getElementById(
        'loading'
      )
      .textContent =
        '訂單連結不完整，請重新掃描門市提供的 QR Code。';

    return false;
  }


  document
    .getElementById(
      'customerForm'
    )
    .action =
      API_URL;


  document
    .getElementById(
      'orderNo'
    )
    .textContent =
      '訂單編號：' +
      ORDER_NO;


  document
    .getElementById(
      'product'
    )
    .textContent =
      PRODUCT ||
      '門市訂購商品';


  const initialMoney =
    money(
      TOTAL
    );


  document
    .getElementById(
      'total'
    )
    .textContent =
      initialMoney === '金額讀取失敗'
        ? '訂單金額：讀取中...'
        : (
            '訂單金額：' +
            initialMoney
          );


  document
    .getElementById(
      'loading'
    )
    .style.display =
      'none';


  document
    .getElementById(
      'app'
    )
    .style.display =
      'block';


  return true;
}


function syncHidden(){
  document.getElementById('fOrderNo').value = ORDER_NO;
  document.getElementById('fToken').value = TOKEN;
  document.getElementById('fLineUserId').value = LINE_USER_ID;
  document.getElementById('fLineDisplayName').value = LINE_DISPLAY_NAME;
  document.getElementById('fLineAccessToken').value = LINE_ACCESS_TOKEN;
  document.getElementById('fLineIdToken').value = LINE_ID_TOKEN;
}


function updateSubmit(){

  const btn =
    document.getElementById(
      'submitBtn'
    );


  const email =
    String(
      document
        .getElementById(
          'email'
        )?.value || ''
    ).trim();


  const triplicateEmailRequired =
    INVOICE_TYPE ===
    '公司（三聯）';


  // 三聯發票只要求「有輸入內容」即可，
  // 不檢查是否為有效 Email 格式。
  const emailReady =
    !triplicateEmailRequired
    ||
    Boolean(
      email
    );


  if(
    LIFF_OK &&
    IS_FRIEND &&
    emailReady
  ){

    btn.disabled =
      false;

    const isNewMultiStore =
      STORE_CODE === 'TP' ||
      STORE_CODE === 'HC';

    if(
      PAYMENT_METHOD ===
      'LINE Pay'
    ){

      btn.textContent =
        '下一步｜LINE Pay付款';

    } else if(
      isNewMultiStore &&
      PAYMENT_METHOD ===
        '信用卡'
    ){

      btn.textContent =
        '下一步｜付款';

    } else {

      btn.textContent =
        '確認送出收件資料';
    }

  } else if(
    LIFF_OK &&
    IS_FRIEND &&
    triplicateEmailRequired &&
    !emailReady
  ){

    btn.disabled =
      true;

    btn.textContent =
      '請先填寫 Email';

  } else if(
    LIFF_OK &&
    !IS_FRIEND
  ){

    btn.disabled =
      true;

    btn.textContent =
      '請先加入 LINE 好友';

  } else {

    btn.disabled =
      true;

    btn.textContent =
      'LINE 連結中...';
  }
}


async function checkFriend(){

  try{

    const r =
      await liff.getFriendship();

    IS_FRIEND =
      !!(
        r &&
        r.friendFlag
      );


    document
      .getElementById(
        'friendBox'
      )
      .classList.toggle(
        'show',
        !IS_FRIEND
      );


    if(
      IS_FRIEND
    ){

      setStatus(
        LINE_DISPLAY_NAME
          ? `LINE 已連結：${LINE_DISPLAY_NAME}｜已加入官方帳號`
          : 'LINE 身分已連結｜已加入官方帳號',
        'ok'
      );

    } else {

      setStatus(
        'LINE 已連結，但尚未加入 YOKA 官方帳號',
        'warn'
      );
    }

  } catch(err){

    IS_FRIEND =
      false;


    document
      .getElementById(
        'friendBox'
      )
      .classList.add(
        'show'
      );


    setStatus(
      '無法確認好友狀態，請確認 LIFF 已開啟 profile 權限',
      'error'
    );
  }


  updateSubmit();

  return IS_FRIEND;
}


async function requestFriend(){

  try{

    if(
      typeof liff.requestFriendship ===
      'function'
    ){

      await liff.requestFriendship();

      await checkFriend();

    } else {

      alert(
        '目前 LINE 版本不支援直接加入好友，請先加入 YOKA 官方 LINE 後再回到此頁。'
      );
    }

  } catch(err){

    alert(
      '無法開啟加入好友視窗，請確認 LIFF 使用 Full 畫面並已連結 YOKA 官方帳號。'
    );
  }
}


async function initApp(){

  try{

    // ① 一定先初始化 LIFF。
    // 不可在這之前讀 order/token/api。
    await liff.init({
      liffId:
        resolveLiffIdBeforeInit(),
      withLoginOnExternalBrowser:
        true
    });


    // ② init 完成後，LINE 已把 liff.state 還原成原始參數。
    readOrderParamsAfterLiffInit();


    // ③ 先顯示訂單。
    if(
      !renderOrder()
    ){
      return;
    }


    await loadOrderMeta();


    if(
      !liff.isLoggedIn()
    ){

      setStatus(
        '正在登入 LINE...',
        'warn'
      );

      return;
    }


    LINE_ID_TOKEN =
      liff.getIDToken() ||
      '';


    LINE_ACCESS_TOKEN =
      liff.getAccessToken() ||
      '';


    const decoded =
      liff.getDecodedIDToken();


    if(
      decoded &&
      decoded.sub
    ){

      LINE_USER_ID =
        decoded.sub;
    }


    try{

      const context =
        liff.getContext();


      if(
        !LINE_USER_ID &&
        context &&
        context.userId
      ){

        LINE_USER_ID =
          context.userId;
      }

    }catch(e){}


    try{

      const profile =
        await liff.getProfile();


      LINE_USER_ID =
        LINE_USER_ID ||
        profile.userId ||
        '';


      LINE_DISPLAY_NAME =
        profile.displayName ||
        '';

    }catch(e){}


    if(
      !LINE_USER_ID
    ){

      setStatus(
        'LINE 已登入，但無法取得使用者身分，請確認 openid / profile 權限',
        'error'
      );

      return;
    }


    LIFF_OK =
      true;


    syncHidden();


    await checkFriend();


  }catch(err){

    console.error(
      err
    );


    document
      .getElementById(
        'loading'
      )
      .textContent =
        'LINE LIFF 初始化失敗，請關閉後重新掃描 QR Code。';
  }
}



function isNewMultiStoreOnlinePayment(){

  // V18.35：所有門市的 LINE Pay 一律走 hidden iframe POST + API polling。
  // 付款網址由 Apps Script 建立並寫回試算表後，GitHub 頂層頁直接 window.location.href 跳轉。
  // 這可避開 Apps Script HtmlService / LIFF WebView 對 meta refresh、window.top 導航的限制。
  if (PAYMENT_METHOD === 'LINE Pay') {
    return true;
  }

  // 信用卡目前只保留台北／新竹既有線上付款分支。
  return (
    (STORE_CODE === 'TP' || STORE_CODE === 'HC') &&
    PAYMENT_METHOD === '信用卡'
  );
}

  paymentUrl
){

  PAYMENT_URL =

      paymentUrl || ''
    );


  document
    .getElementById(
      'app'
    )
    .style.display =

  const panel =
    document.getElementById(

    );


  panel.style.display =

    .getElementById(
      'paymentOrderNo'
    )
    .textContent =

    .getElementById(
      'paymentAmount'
    )

  );
}


async function openExternalPayment(){

  const btn =
    document.getElementById(
      'openPaymentBtn'
    );


  btn.disabled =
    true;

  btn.textContent =
    '正在建立安全付款...';


  try{

    const url =
      new URL(
        API_URL
      );


    url.searchParams.set(
      'action',
      'getNewebpayFormData'
    );

    url.searchParams.set(
      'orderNo',
      ORDER_NO
    );

    url.searchParams.set(
      'token',
      TOKEN
    );


    const response =
      await fetch(
        url.toString(),
        {
          method:
            'GET',
          cache:
            'no-store'
        }
      );


    if(
      !response.ok
    ){
      throw new Error(
        '付款資料讀取失敗'
      );
    }


    const data =
      await response.json();


    if(
      !data ||
      !data.success
    ){

      throw new Error(
        (
          data &&
          data.message
        )
          ? data.message
          : '無法建立付款資料'
      );
    }


    const form =
      document.createElement(
        'form'
      );


    form.method =
      'POST';

    form.action =
      data.gatewayUrl;

    form.style.display =
      'none';


    [
      'MerchantID',
      'TradeInfo',
      'TradeSha',
      'Version'
    ].forEach(
      function(name){

        const input =
          document.createElement(
            'input'
          );


        input.type =
          'hidden';

        input.name =
          name;

        input.value =
          String(
            data[name] || ''
          );


        form.appendChild(
          input
        );
      }
    );


    document.body.appendChild(
      form
    );


    btn.textContent =
      '正在前往藍新付款...';


    // 標準前景 HTML Form POST：
    // 由目前頂層 GitHub 頁面直接提交到藍新 MPG。
    form.submit();


  }catch(err){

    console.error(
      err
    );


    btn.disabled =
      false;

    btn.textContent =
      '前往安全付款';


    const box =
      document.getElementById(
        'errorBox'
      );


    if(box){

      box.style.display =
        'block';

      box.textContent =
        err &&
        err.message
          ? err.message
          : '付款頁建立失敗，請稍後再試。';
    }
  }
}

// V18.36：Apps Script hidden iframe 一取得 LINE Pay paymentUrl，
// 直接以 postMessage 傳回目前 GitHub / LIFF 頂層頁。
// 不再必須等待試算表寫入後由 polling 重新讀回。
let LINEPAY_REDIRECTING = false;

window.addEventListener('message', function(event){
  try {
    const frame = document.getElementById('submitFrame');
    if (!frame || event.source !== frame.contentWindow) return;

    const data = event.data || {};
    const btn = document.getElementById('submitBtn');
    const progress = document.getElementById('payProgress');

    if (data.type === 'YOKA_LINEPAY_ERROR') {
      const msg = String(data.message || 'LINE Pay 付款建立失敗，請再試一次。').trim();
      if (progress) progress.style.display = 'none';
      showError(msg);
      if (btn) {
        btn.disabled = false;
        btn.textContent = '下一步｜LINE Pay付款';
      }
      return;
    }

    if (data.type !== 'YOKA_LINEPAY_READY') return;

    const paymentUrl = String(data.paymentUrl || '').trim();
    if (!paymentUrl || !/^https:\/\//i.test(paymentUrl)) return;
    if (LINEPAY_REDIRECTING) return;
    LINEPAY_REDIRECTING = true;

    if (btn) {
      btn.disabled = true;
      btn.textContent = '正在前往 LINE Pay 付款...';
    }
    if (progress) {
      progress.style.display = 'block';
      progress.textContent = '付款頁已準備完成，正在開啟 LINE Pay…';
    }

    PAYMENT_URL = paymentUrl;
    window.location.replace(paymentUrl);
  } catch (err) {
    console.warn('LINE Pay 即時交接失敗，改由 polling 備援', err);
  }
});

async function waitForPaymentRedirect(){

  const btn =
    document.getElementById(
      'submitBtn'
    );


  const progress =
    document.getElementById(
      'payProgress'
    );

  if (progress) {
    progress.style.display = 'block';
    progress.textContent = '正在建立 LINE Pay 付款頁，請稍候…';
  }


  const startedAt =
    Date.now();


  // 最多等待 25 秒。
  // 通常 LINE Pay Request 完成後 1~3 秒內即可取得 paymentUrl。
  while(
    Date.now() - startedAt <
      25000
  ){

    try{

      const url =
        new URL(
          API_URL
        );


      url.searchParams.set(
        'action',
        'getCustomerPaymentRedirect'
      );


      url.searchParams.set(
        'orderNo',
        ORDER_NO
      );


      url.searchParams.set(
        'token',
        TOKEN
      );


      // 避免 WebView / CDN 快取舊的尚未 ready 結果。
      url.searchParams.set(
        '_ts',
        String(
          Date.now()
        )
      );


      const response =
        await fetch(
          url.toString(),
          {
            method:
              'GET',
            redirect:
              'follow',
            cache:
              'no-store'
          }
        );


      if(
        response.ok
      ){

        const res =
          await response.json();


        // V18.38：後端 LINE Pay Request 若失敗，立即顯示真正錯誤，
        // 不再繼續空等到 25 秒逾時。
        if(
          res &&
          (res.error || res.success === false) &&
          res.message
        ){
          if (progress) progress.style.display = 'none';
          showError(String(res.message));
          btn.disabled = false;
          btn.textContent = '下一步｜LINE Pay付款';
          return;
        }


        if(
          res &&
          res.success &&
          res.ready &&
          res.paymentUrl
        ){

          btn.textContent =
            '正在前往 LINE Pay 付款...';

          if (progress) {
            progress.textContent = '付款頁已準備完成，正在開啟 LINE Pay…';
          }


          // 完全採台北／新竹已正常運作方式：
          // 由 GitHub 頂層頁直接轉址到 LINE Pay。
          if (!LINEPAY_REDIRECTING) {
            LINEPAY_REDIRECTING = true;
            window.location.replace(
              res.paymentUrl
            );
          }


          return;
        }


        if(
          res &&
          res.success &&
          res.ready &&
          !res.paymentUrl
        ){

          showError(
            '訂單已成立，但未取得 LINE Pay 付款網址，請重新開啟訂單。'
          );


          btn.disabled =
            false;


          btn.textContent =
            '下一步｜LINE Pay付款';


          return;
        }
      }

    }catch(err){

      console.warn(
        '等待 LINE Pay 付款網址',
        err
      );
    }


    // 與台北／新竹相同，每 500ms 讀取一次付款網址。
    await new Promise(
      resolve =>
        setTimeout(
          resolve,
          500
        )
    );
  }


  if (progress) {
    progress.style.display = 'none';
  }

  showError(
    'LINE Pay 付款頁準備逾時。訂單已成立，請直接使用 LINE 收到的付款連結，或重新開啟此訂單。'
  );


  btn.disabled =
    false;


  btn.textContent =
    '下一步｜LINE Pay付款';
}


document
  .getElementById(
    'customerForm'
  )
  .addEventListener(
    'submit',
    async function(e){

      e.preventDefault();


      document
        .getElementById(
          'error'
        )
        .style.display =
          'none';


      if(
        !LIFF_OK ||
        !LINE_USER_ID
      ){

        showError(
          'LINE 身分尚未完成連結，請稍候後再試。'
        );

        return;
      }


      const friend =
        await checkFriend();


      if(
        !friend
      ){

        showError(
          '請先加入 YOKA 官方 LINE 好友後再送出。'
        );

        return;
      }


      const email =
        document
          .getElementById(
            'email'
          )
          .value
          .trim();


      if(
        INVOICE_TYPE ===
          '公司（三聯）'
        &&
        !email
      ){

        showError(
          '三聯發票請填寫 Email，電子發票將寄送至此信箱。'
        );

        document
          .getElementById(
            'email'
          )
          .focus();

        return;
      }


      if(
        !this.reportValidity()
      ){
        return;
      }


      syncHidden();


      const btn =
        document.getElementById(
          'submitBtn'
        );


      btn.disabled =
        true;


      btn.textContent =
        PAYMENT_METHOD ===
          'LINE Pay'
          ? '正在建立 LINE Pay 付款...'
          : '資料送出中...';


      // V18.35：所有門市 LINE Pay，以及台北／新竹信用卡：
      // 收件資料背景送出，GitHub 頁面保留控制權，
      // 後端建立付款網址並寫入後，由 polling 取得 URL 立即頂層跳轉。
      if(
        isNewMultiStoreOnlinePayment()
      ){

        this.target =
          'submitFrame';

        this.submit();

        btn.textContent =
          PAYMENT_METHOD ===
            'LINE Pay'
            ? '正在建立 LINE Pay 付款...'
            : '訂單建立中...';

        waitForPaymentRedirect();

        return;
      }


      // 其餘付款方式維持一般頂層 POST。
      // LINE Pay 不應進入此分支；若進入代表付款方式或訂單資料未正確載入。
      this.removeAttribute(
        'target'
      );

      if(
        PAYMENT_METHOD === 'LINE Pay'
      ){
        btn.textContent =
          '正在前往 LINE Pay 付款...';
      }

      this.submit();
    }
  );


// 啟動
document
  .getElementById(
    'email'
  )
  .addEventListener(
    'input',
    updateSubmit
  );


initApp();
</script>
