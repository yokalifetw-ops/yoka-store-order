<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>YOKA QR 掃碼 V13.3</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#111;color:#fff;font-family:Arial,"Microsoft JhengHei",sans-serif}
.page{min-height:100vh;padding:max(16px,env(safe-area-inset-top)) 14px max(16px,env(safe-area-inset-bottom))}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.title{font-size:22px;font-weight:900}.close{width:44px;height:44px;border:0;border-radius:10px;font-size:20px}
.card{background:#fff;color:#111;border-radius:18px;padding:14px}
.viewport{position:relative;width:100%;aspect-ratio:3/4;background:#000;border-radius:14px;overflow:hidden}
#video{width:100%;height:100%;object-fit:cover}
.guide{position:absolute;left:12%;right:12%;top:25%;bottom:25%;border:3px solid #fff;border-radius:18px;box-shadow:0 0 0 9999px rgba(0,0,0,.18);pointer-events:none}
#reader{display:none}
.status{margin-top:12px;padding:12px;border-radius:10px;background:#f3f4f6;line-height:1.5;text-align:center}
.tip{margin-top:10px;font-size:14px;color:#555;line-height:1.6;text-align:center}
.actions{display:grid;grid-template-columns:1fr;gap:8px;margin-top:12px}
.btn{min-height:50px;border:0;border-radius:12px;background:#111;color:#fff;font-size:16px;font-weight:900}
.secondary{background:#eee;color:#111}
.manual{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:12px}
.manual input{min-width:0;height:48px;border:1px solid #ccc;border-radius:10px;padding:0 12px;font-size:16px}
.manual button{border:0;border-radius:10px;background:#111;color:#fff;padding:0 18px;font-weight:900}
#photoInput{display:none}
.debug{margin-top:10px;font-size:12px;color:#777;word-break:break-all}
</style>
</head>
<body>
<div class="page">
  <div class="head">
    <div id="title" class="title">YOKA QR 掃碼</div>
    <button class="close" type="button" onclick="goBack()">✕</button>
  </div>
  <div class="card">
    <div class="viewport" id="viewport">
      <video id="video" playsinline muted autoplay></video>
      <div class="guide"></div>
    </div>
    <div id="reader"></div>
    <div id="status" class="status">正在檢查手機相機…</div>
    <div class="tip">將 QR 碼放入白框內。掃到後會自動回到門市開單頁。</div>
    <div class="actions">
      <button class="btn secondary" type="button" onclick="retryCamera()">重新開啟相機</button>
      <label class="btn secondary" style="display:flex;align-items:center;justify-content:center" for="photoInput">拍照／選照片辨識</label>
      <input id="photoInput" type="file" accept="image/*" capture="environment" onchange="scanPhoto(event)">
    </div>
    <div class="manual">
      <input id="manualValue" autocomplete="off" placeholder="測試用：手動輸入 QR 內容">
      <button type="button" onclick="submitManual()">確定</button>
    </div>
    <div id="debug" class="debug"></div>
  </div>
</div>
<script>
const P=new URLSearchParams(location.search);
const TARGET=P.get('target')==='carrier'?'carrier':'product';
const RETURN_URL=P.get('return')||'';
let stream=null, detector=null, html5Scanner=null, locked=false, raf=0;

function status(t){document.getElementById('status').textContent=t}
function debug(t){document.getElementById('debug').textContent=t||''}

function finish(
  value
) {

  if (locked) {
    return;
  }


  const v =
    String(
      value || ''
    ).trim();


  if (!v) {
    return;
  }


  locked =
    true;


  stopCamera();


  status(
    '掃描成功：' +
    v +
    '｜正在回傳門市系統…'
  );


  // --------------------------------------------------------
  // V13.3 主流程：
  // Scanner 是由門市前台用 window.open() 開啟，
  // 直接 postMessage 回原視窗，不重新載入 Apps Script。
  // --------------------------------------------------------

  try {

    if (
      window.opener &&
      !window.opener.closed
    ) {

      window.opener.postMessage(
        {
          type:
            'YOKA_SCAN_RESULT',

          target:
            TARGET,

          value:
            v
        },
        '*'
      );


      try {

        window.opener.focus();

      } catch (focusErr) {
        // iOS Safari 可忽略
      }


      setTimeout(
        () => {

          window.close();


          // 若 iOS Safari 沒有允許自動關閉，
          // 顯示明確提示，而不是白畫面。
          setTimeout(
            () => {

              if (!window.closed) {

                status(
                  '掃描已回傳完成。請切回 YOKA 門市開單頁，此頁可直接關閉。'
                );
              }

            },
            400
          );

        },
        250
      );


      return;
    }

  } catch (err) {
    // opener 被瀏覽器限制時走下方備援。
  }


  // --------------------------------------------------------
  // 備援流程：舊式網址回傳
  // 只有 opener 不存在時才使用。
  // --------------------------------------------------------

  if (RETURN_URL) {

    const back =
      new URL(
        RETURN_URL
      );


    back.searchParams.set(
      'scanTarget',
      TARGET
    );


    back.searchParams.set(
      'scanValue',
      v
    );


    setTimeout(
      () => {

        window.location.replace(
          back.toString()
        );

      },
      250
    );


    return;
  }


  status(
    '掃描成功：' +
    v +
    '。請回到 YOKA 門市開單頁。'
  );
}

async function initDetector(){
  if(!('BarcodeDetector' in globalThis))return false;
  try{
    const formats=await BarcodeDetector.getSupportedFormats();
    if(!formats.includes('qr_code'))return false;
    detector=new BarcodeDetector({formats:['qr_code']});
    return true;
  }catch(e){debug('BarcodeDetector: '+(e.message||e));return false}
}

async function startNativeCamera(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)
    throw new Error('此瀏覽器沒有提供 getUserMedia');
  stream=await navigator.mediaDevices.getUserMedia({
    audio:false,
    video:{
      facingMode:{ideal:'environment'},
      width:{ideal:1920},
      height:{ideal:1080}
    }
  });
  const video=document.getElementById('video');
  video.srcObject=stream;
  await video.play();
  status('相機已開啟，請對準 QR 碼');
  scanFrames();
}

async function scanFrames(){
  if(locked||!stream||!detector)return;
  const video=document.getElementById('video');
  try{
    if(video.readyState>=2){
      const codes=await detector.detect(video);
      if(codes&&codes.length&&codes[0].rawValue){
        finish(codes[0].rawValue);return;
      }
    }
  }catch(e){}
  raf=requestAnimationFrame(scanFrames);
}

async function startHtml5Camera(){
  document.getElementById('viewport').style.display='none';
  document.getElementById('reader').style.display='block';
  if(typeof Html5Qrcode==='undefined')throw new Error('備援掃碼元件未載入');
  html5Scanner=new Html5Qrcode('reader');
  await html5Scanner.start(
    {facingMode:'environment'},
    {fps:10,qrbox:{width:260,height:260},aspectRatio:1},
    txt=>finish(txt),
    ()=>{}
  );
  status('備援相機已開啟，請對準 QR 碼');
}

async function boot(){
  document.getElementById('title').textContent=
    TARGET==='carrier'?'YOKA 載具 QR 掃碼':'YOKA 商品 QR 掃碼';
  debug('HTTPS='+window.isSecureContext+'｜UA='+navigator.userAgent);
  try{
    const nativeOK=await initDetector();
    if(nativeOK){
      await startNativeCamera();
      return;
    }
    status('此瀏覽器不支援原生 QR API，切換相容掃碼模式…');
    await startHtml5Camera();
  }catch(e){
    const msg=e&&e.message?e.message:String(e||'未知錯誤');
    status('相機無法開啟：'+msg);
    debug('HTTPS='+window.isSecureContext+'｜'+msg+'｜UA='+navigator.userAgent);
  }
}

async function scanPhoto(ev){
  const input=ev.target;
  const file=input.files&&input.files[0];
  if(!file)return;
  status('正在辨識照片…');
  try{
    if('BarcodeDetector' in globalThis){
      const formats=await BarcodeDetector.getSupportedFormats();
      if(formats.includes('qr_code')){
        const bitmap=await createImageBitmap(file);
        const d=new BarcodeDetector({formats:['qr_code']});
        const result=await d.detect(bitmap);
        if(result&&result.length){finish(result[0].rawValue);return}
      }
    }
    if(typeof Html5Qrcode==='undefined')throw new Error('沒有可用的照片辨識器');
    if(!html5Scanner)html5Scanner=new Html5Qrcode('reader');
    const txt=await html5Scanner.scanFile(file,true);
    finish(txt);
  }catch(e){
    status('照片未辨識到 QR。請把 QR 放大後再拍。');
    debug('Photo: '+(e.message||e));
  }finally{input.value=''}
}

function stopCamera(){
  if(raf)cancelAnimationFrame(raf);
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
  if(html5Scanner){
    try{html5Scanner.stop().catch(()=>{})}catch(e){}
  }
}

function retryCamera(){stopCamera();locked=false;setTimeout(boot,100)}
function submitManual(){finish(document.getElementById('manualValue').value)}
function goBack() {

  stopCamera();


  try {

    if (
      window.opener &&
      !window.opener.closed
    ) {

      window.opener.focus();


      window.close();


      return;
    }

  } catch (err) {
    // 忽略並使用下方備援
  }


  if (RETURN_URL) {

    window.location.replace(
      RETURN_URL
    );

    return;
  }


  history.back();
}
addEventListener('pagehide',stopCamera);
addEventListener('load',boot);
</script>
</body>
</html>
