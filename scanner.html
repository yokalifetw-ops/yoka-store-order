<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover">

  <title>YOKA QR 掃碼</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #111;
      color: #fff;
      font-family:
        Arial,
        "Microsoft JhengHei",
        sans-serif;
    }

    .page {
      min-height: 100vh;
      padding:
        max(18px, env(safe-area-inset-top))
        16px
        max(18px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
    }

    .head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .title {
      font-size: 22px;
      font-weight: 900;
    }

    .close {
      border: 0;
      border-radius: 10px;
      background: #fff;
      color: #111;
      min-width: 44px;
      height: 44px;
      font-size: 20px;
      font-weight: 900;
    }

    .card {
      background: #fff;
      color: #111;
      border-radius: 18px;
      padding: 14px;
    }

    #reader {
      width: 100%;
      min-height: 320px;
      overflow: hidden;
      border-radius: 14px;
      background: #000;
    }

    #reader video {
      object-fit: cover !important;
    }

    .tip {
      margin-top: 12px;
      font-size: 14px;
      line-height: 1.6;
      color: #555;
      text-align: center;
    }

    .status {
      margin-top: 12px;
      padding: 12px;
      border-radius: 10px;
      background: #f3f4f6;
      color: #222;
      font-size: 14px;
      line-height: 1.5;
      text-align: center;
    }

    .fallback {
      display: none;
      margin-top: 12px;
    }

    .fallback label {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      border-radius: 12px;
      background: #111;
      color: #fff;
      font-weight: 900;
    }

    .fallback input {
      display: none;
    }

    .manual {
      margin-top: 12px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
    }

    .manual input {
      width: 100%;
      min-height: 48px;
      border: 1px solid #ccc;
      border-radius: 10px;
      padding: 0 12px;
      font-size: 16px;
    }

    .manual button {
      min-height: 48px;
      border: 0;
      border-radius: 10px;
      padding: 0 18px;
      background: #111;
      color: #fff;
      font-weight: 900;
    }
  </style>
</head>

<body>

  <div class="page">

    <div class="head">
      <div
        id="title"
        class="title">
        YOKA 商品 QR 掃碼
      </div>

      <button
        class="close"
        type="button"
        onclick="goBackWithoutScan()">
        ✕
      </button>
    </div>

    <div class="card">

      <div id="reader"></div>

      <div
        id="status"
        class="status">
        正在啟動相機…
      </div>

      <div class="tip">
        將單一 QR 碼放在畫面中央，建議約佔畫面寬度 30～60%。
        掃描成功後會自動回到 YOKA 開單頁。
      </div>

      <div
        id="fallback"
        class="fallback">

        <label for="photoInput">
          📷 相機無法即時開啟？改用拍照辨識
        </label>

        <input
          id="photoInput"
          type="file"
          accept="image/*"
          capture="environment"
          onchange="scanPhoto(event)">
      </div>

      <div class="manual">
        <input
          id="manualValue"
          autocomplete="off"
          placeholder="或手動輸入 QR 內容">

        <button
          type="button"
          onclick="submitManual()">
          確定
        </button>
      </div>

    </div>

  </div>


<script>

const params =
  new URLSearchParams(
    window.location.search
  );


const TARGET =
  params.get(
    'target'
  ) === 'carrier'
    ? 'carrier'
    : 'product';


const RETURN_URL =
  params.get(
    'return'
  ) || '';


let scanner = null;

let locked = false;


function setStatus(
  text
) {

  document
    .getElementById(
      'status'
    )
    .textContent =
      text;
}


function finishScan(
  value
) {

  if (locked) {
    return;
  }


  const scanned =
    String(
      value || ''
    ).trim();


  if (!scanned) {
    return;
  }


  locked =
    true;


  setStatus(
    '掃描成功：' +
    scanned
  );


  if (!RETURN_URL) {

    alert(
      '掃描成功：' +
      scanned +
      '\n\n但缺少回傳網址。'
    );

    return;
  }


  const back =
    new URL(
      RETURN_URL
    );


  back.searchParams.set(
    'scanTarget',
    TARGET
  );


  back.searchParams.set(
    'scanValue',
    scanned
  );


  setTimeout(
    () => {

      window.location.replace(
        back.toString()
      );

    },
    250
  );
}


async function startScanner() {

  document
    .getElementById(
      'title'
    )
    .textContent =
      TARGET === 'carrier'
        ? 'YOKA 載具 QR 掃碼'
        : 'YOKA 商品 QR 掃碼';


  try {

    if (
      typeof Html5Qrcode ===
      'undefined'
    ) {

      throw new Error(
        'QR 掃碼元件載入失敗'
      );
    }


    scanner =
      new Html5Qrcode(
        'reader'
      );


    const cameras =
      await Html5Qrcode
        .getCameras();


    if (
      !cameras ||
      !cameras.length
    ) {

      throw new Error(
        '找不到可用相機'
      );
    }


    let cameraId =
      cameras[0].id;


    const backCamera =
      cameras.find(
        camera => {

          const label =
            String(
              camera.label || ''
            ).toLowerCase();


          return (
            label.includes(
              'back'
            ) ||
            label.includes(
              'rear'
            ) ||
            label.includes(
              'environment'
            ) ||
            label.includes(
              '後'
            )
          );
        }
      );


    if (backCamera) {

      cameraId =
        backCamera.id;
    }


    await scanner.start(
      cameraId,
      {
        fps:
          12,

        qrbox:
          (
            width,
            height
          ) => {

            const size =
              Math.floor(
                Math.min(
                  width,
                  height
                ) *
                0.72
              );


            return {
              width:
                size,
              height:
                size
            };
          },

        aspectRatio:
          1
      },
      decodedText => {

        finishScan(
          decodedText
        );
      },
      () => {
        // 未辨識影格忽略
      }
    );


    setStatus(
      '相機已開啟，請對準 QR 碼'
    );


  } catch (err) {

    const message =
      err &&
      err.message
        ? err.message
        : String(
            err || '未知錯誤'
          );


    setStatus(
      '即時相機無法開啟：' +
      message
    );


    document
      .getElementById(
        'fallback'
      )
      .style.display =
        'block';
  }
}


async function scanPhoto(
  event
) {

  const input =
    event &&
    event.target
      ? event.target
      : null;


  const file =
    input &&
    input.files &&
    input.files.length
      ? input.files[0]
      : null;


  if (!file) {
    return;
  }


  try {

    if (!scanner) {

      scanner =
        new Html5Qrcode(
          'reader'
        );
    }


    setStatus(
      '正在辨識照片…'
    );


    const value =
      await scanner.scanFile(
        file,
        true
      );


    finishScan(
      value
    );


  } catch (err) {

    setStatus(
      '照片中未辨識到 QR，請重新拍攝。'
    );


    alert(
      '照片中未辨識到 QR，請讓 QR 放大、保持正面並重新拍攝。'
    );


  } finally {

    if (input) {

      input.value =
        '';
    }
  }
}


function submitManual() {

  const value =
    document
      .getElementById(
        'manualValue'
      )
      .value
      .trim();


  if (!value) {
    return;
  }


  finishScan(
    value
  );
}


function goBackWithoutScan() {

  if (!RETURN_URL) {

    history.back();

    return;
  }


  window.location.replace(
    RETURN_URL
  );
}


window.addEventListener(
  'load',
  startScanner
);

</script>

</body>
</html>
